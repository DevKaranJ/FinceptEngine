[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FinceptEngine"
version = "0.1.0"
description = "Self-Improving Multi-Paradigm Quantitative Trading Engine — Binance Spot + USDⓈ-M Futures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinceptEngine" }]
keywords = ["trading", "quant", "binance", "backtest", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b0",
    "scipy>=1.11.0",
    "websockets>=12.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["trading_engine/tests"]
addopts = "-q"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_engine*"]
